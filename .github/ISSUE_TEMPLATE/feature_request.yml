name: Feature request
description: Suggest an improvement or a new feature
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, for example "submit a thesis in my university's template". What gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Mention other editors that do it well, if any.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you use now
