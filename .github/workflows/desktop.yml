name: Desktop app

# Builds the installers on every OS and launches each packaged app once
# (TEXCRAFT_SMOKE_TEST=1). Pushing a tag like v0.4.0 also uploads the
# installers to a draft GitHub Release, ready to review and publish.
on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            app: release/mac-arm64/TexCraft.app/Contents/MacOS/TexCraft
          - os: windows-latest
            target: --win
            app: release/win-unpacked/TexCraft.exe
          - os: ubuntu-latest
            target: --linux
            app: release/linux-unpacked/texcraft
    steps:
      - uses: actions/checkout@v5
      - name: pnpm version from packageManager
        id: pnpm
        shell: bash
        run: echo "version=$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm.outputs.version }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Package
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional signing. Without these secrets the macOS app is ad-hoc
          # signed and Windows shows SmartScreen; see docs/desktop-app.md.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args=(${{ matrix.target }} --publish never)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=("-c.extraMetadata.version=${GITHUB_REF_NAME#v}")
          fi
          if [[ "$RUNNER_OS" == "macOS" && -z "$CSC_LINK" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            args+=("-c.mac.identity=-")
          fi
          pnpm exec electron-builder "${args[@]}"

      - name: Launch the packaged app once
        working-directory: apps/desktop
        shell: bash
        env:
          TEXCRAFT_SMOKE_TEST: "1"
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a "${{ matrix.app }}" --no-sandbox
          else
            "${{ matrix.app }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: texcraft-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Draft release with the installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la installers
          gh release create "$GITHUB_REF_NAME" installers/* \
            --repo "$GITHUB_REPOSITORY" --draft --generate-notes \
            --title "TexCraft ${GITHUB_REF_NAME#v}"
